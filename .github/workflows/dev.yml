name: dev-CI

on:
  push:
    branches: [ "dev" ]
    
jobs:
  build-test:
    runs-on: ubuntu-22.04

    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install deps
        run: npm install
        
      - name: Run tests
        run: npm test

      - name: Build test
        run: npm run build

