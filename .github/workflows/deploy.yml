name: CI/CD Node-TS

on:
  pull_request:
    types: closed
    branches: [ "master" ]
    
jobs:
  build-test-deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-22.04

    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Install deps
        run: npm install
        
      - name: Run tests
        run: npm test

      - name: Build test
        run: npm run build
        
      - name: Docker login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/app:latest .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/app:latest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:

          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd /home/${{ secrets.VM_USER }}
            docker stop app || true
            docker rm app || true
            docker pull ${{ secrets.DOCKER_USERNAME }}/app:latest
            docker run -d -p 5000:5000 --env-file .env --restart always --name app ${{ secrets.DOCKER_USERNAME }}/app:latest
 
